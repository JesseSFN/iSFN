services:
  isfn:
    build: .
    image: isfn:latest
    container_name: isfn
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Verplicht, minimaal 8 tekens. Zet het in het bestand .env (zie .env.example).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Zet ADMIN_PASSWORD in het bestand .env (minimaal 8 tekens)}
      # Alleen achter een reverse proxy met https: zie README.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - isfn-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  isfn-data:
